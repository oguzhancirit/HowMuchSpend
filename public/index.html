<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111715"><meta name="description" content="Gelirin, giderin ve ödeme günlerin. Hepsi tek bir takvimde.">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="HowMuchSpend">
  <title>HowMuchSpend</title>
  <link rel="icon" href="./icon.svg?v=17" type="image/svg+xml"><link rel="apple-touch-icon" href="./apple-touch-icon.png?v=17"><link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css?v=17"><script defer src="./update.js?v=17"></script><script type="module" src="./app.js?v=17"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#calendar" data-view="calendar" aria-label="HowMuchSpend ana sayfa"><img class="brand-mark" src="./icon.svg?v=17" alt="" width="38" height="38"><span>HowMuch<span class="muted">Spend</span></span></a>
    <div class="workspace"><span class="avatar">O</span><div>Kişisel takvim</div></div>
    <p class="nav-label">ÇALIŞMA ALANIN</p>
    <nav class="desktop-nav" aria-label="Ana menü"></nav>

    <div class="sidebar-footer"><span class="live-dot"></span> Bu cihazda saklanır <span class="version">v1.6.1</span></div>
  </aside>
  <div class="main-wrap">
    <header class="topbar"><div class="mobile-brand"><img class="brand-mark" src="./icon.svg?v=17" alt="" width="38" height="38"> HowMuchSpend</div><div class="breadcrumb">Kişisel alan <span>/</span> <strong id="breadcrumb">Takvim</strong></div><div class="top-actions"><select id="display-currency" class="currency-select" aria-label="Takvim ve özet para birimi"><option value="TRY">TL</option><option value="EUR">EUR</option><option value="USD">USD</option></select><button class="icon-button desktop-add" data-action="add" aria-label="Gelir veya gider ekle">＋</button><button class="icon-button" id="privacy" aria-label="Tutarları gizle"></button><button class="avatar" data-view="settings" aria-label="Ayarları aç">O</button></div></header>
    <main id="main" tabindex="-1"></main>

  </div>
</div>
<nav class="bottom-nav" aria-label="Mobil menü"></nav>
<dialog id="entry-dialog" class="sheet" aria-labelledby="entry-title">
  <div class="sheet-handle"></div><div class="sheet-head"><div><h2 id="entry-title">Yeni kayıt</h2></div><button type="button" class="icon-button" data-close aria-label="Pencereyi kapat">✕</button></div>
  <form id="entry-form">
    <div class="type-switch"><button type="button" data-type="expense">↗ Gider</button><button type="button" data-type="income">↙ Gelir</button></div>
    <div class="amount-field"><label for="amount">Tutar</label><div><span id="amount-unit" class="sr-only">TL</span><input name="amount" id="amount" inputmode="decimal" placeholder="0,00" required autocomplete="off" maxlength="18"><select id="entry-currency" name="currency" aria-label="Kayıt para birimi"><option value="TRY">TL</option><option value="EUR">EUR</option><option value="USD">USD</option></select></div></div>
    <label class="field">Ne için?<input id="entry-name" name="title" placeholder="Örn. Akbank kart ödemesi" maxlength="100" required></label>
    <div class="form-pair"><div><label class="field">Tarih<input name="startDate" id="entry-date" type="date" min="1900-01-01" max="2199-12-31" required></label><div class="date-shortcuts"><button type="button" data-quick-date="0">Bugün</button><button type="button" data-quick-date="1">Yarın</button></div></div><label class="field">Kategori<select name="category" id="category"></select></label></div>
    <fieldset id="bank-field"><legend>Banka</legend><div class="bank-picker"><button type="button" data-bank="" class="selected">Diğer</button><button type="button" data-bank="ziraat"><img class="bank-logo bank-ziraat" src="./assets/ziraat.png" alt=""> Ziraat</button><button type="button" data-bank="yapikredi"><img class="bank-logo bank-yapikredi" src="./assets/yapikredi.png" alt=""> Yapı Kredi</button><button type="button" data-bank="akbank"><img class="bank-logo bank-akbank" src="./assets/akbank.png" alt=""> Akbank</button></div></fieldset>
    <label class="field" id="scope-field" hidden>Değişikliği uygula<select id="edit-scope"><option value="one">Yalnızca bu kayıt</option><option value="future">Bu ve sonraki tekrarlar</option></select></label>
    <div class="form-pair" id="repeat-fields"><label class="field">Tekrar<select name="recurrence" id="repeat"><option value="none">Tek sefer</option><option value="monthly">Her ay</option><option value="weekly">Her hafta</option><option value="yearly">Her yıl</option></select></label><label class="field" id="repeat-end-field" hidden>Bitiş<select id="end-mode"><option value="never">Süresiz</option><option value="count">Belirli sayıda</option><option value="date">Belirli tarihte</option></select></label></div>
    <label class="field" id="count-field" hidden>Toplam tekrar sayısı <input type="number" id="repeat-count" min="1" max="10000" value="12"><small>İlk kayıt dahil. Taksitli ödemeler için de kullanabilirsin.</small></label>
    <label class="field" id="end-date-field" hidden>Son tarih<input type="date" id="end-date" min="1900-01-01" max="2199-12-31"></label>
    <div class="recurrence-hint" id="repeat-hint" hidden>↻ Sonraki aylarda otomatik görünür. Her tekrarın ödeme durumu ayrıdır.</div>
    <label class="status-option"><span><strong id="paid-label">Ödendi</strong><small id="paid-help">Gerçekleşen giderlere dahil et</small></span><input name="paid" id="paid" type="checkbox" role="switch"></label>
    <details class="notes-disclosure"><summary>Not ekle <span>+</span></summary><textarea id="notes" name="notes" rows="2" maxlength="1000" placeholder="Not"></textarea></details>
    <p class="form-error" id="form-error" role="alert"></p>
    <output id="entry-preview" class="entry-preview" aria-live="polite"></output>
    <div class="sheet-actions"><button type="button" class="danger-text" id="delete-entry" hidden>Kaydı sil</button><button type="submit" class="primary" id="save-entry">Kaydı ekle <span>↗</span></button></div>
  </form>
</dialog>
<dialog id="confirm-dialog" class="small-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p id="confirm-copy"></p><div id="confirm-options"></div><button class="secondary full" data-close>Vazgeç</button></dialog>
<div id="toast" class="toast" role="status"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<noscript>HowMuchSpend’i kullanmak için JavaScript’i açmalısın.</noscript>
</body></html>
